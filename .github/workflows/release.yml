name: Plugin Release
"on":
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package.v2.json'
      - 'package.v3.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Track processed tags to avoid duplicates across package files
          : > processed_tags.txt

          process_package() {
            local pkg_file="$1"
            local plugin_root="$2"
            [ -f "$pkg_file" ] || return 0

            echo "Processing $pkg_file"

            # Extract entries with release == true: output format KEY|VERSION
            mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              plugin_version="${entry##*|}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"

              plugin_dir="${plugin_root}/${plugin_id_lc}"

              if [ ! -d "$plugin_dir" ]; then
                echo "WARN: directory for $plugin_id not found under $plugin_root/, skip."
                continue
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"

              if grep -qxF "$tag" processed_tags.txt; then
                echo "Tag $tag already processed, skip."
                continue
              fi

              # Skip only a complete published release. A missing upload or an
              # API failure must stop the run without rewriting its tag/assets.
              if python .github/scripts/verify_release_assets.py \
                --repo "$GITHUB_REPOSITORY" --tag "$tag" --asset "$asset" --allow-missing; then
                echo "Release $tag is complete; keep it unchanged and skip $plugin_id."
                echo "$tag" >> processed_tags.txt
                continue
              else
                verification_status=$?
                if [ "$verification_status" -ne 3 ]; then
                  return "$verification_status"
                fi
              fi

              if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
                echo "::error::Tag $tag exists without a Release; inspect and recover that release first."
                return 1
              fi

              # Find previous tag for this plugin (any version)
              prev_tag="$(git tag --list "${plugin_id}_v*" --sort=-version:refname | head -n 1 || true)"

              changed=1
              if [ -n "$prev_tag" ]; then
                if git diff --quiet "$prev_tag" -- "$plugin_dir"; then
                  changed=0
                fi
              fi

              if [ "$changed" -eq 0 ]; then
                echo "No changes in $plugin_dir since $prev_tag, skip packaging $plugin_id."
                echo "$tag" >> processed_tags.txt
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              rm -f "$asset"
              (cd "$(dirname "$plugin_dir")" && zip -r "$GITHUB_WORKSPACE/$asset" "$(basename "$plugin_dir")" -x "*/__pycache__/*" -x "*.pyc") >/dev/null

              release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version_key "v${plugin_version}" '
                .[$plugin_id].history[$version_key] // .[$plugin_id].history[$version_key[1:]] // ""
              ' "$pkg_file")"
              if [ -z "$release_notes" ]; then
                release_notes="Automated release of $plugin_id $plugin_version"
                echo "No history found for $plugin_id $plugin_version, using fallback release notes."
              else
                echo "Using history for $plugin_id $plugin_version release notes."
              fi

              echo "Creating release $tag"
              gh release create "$tag" "$asset" --title "$tag" --notes "$release_notes" --latest --target "$GITHUB_SHA"

              python .github/scripts/verify_release_assets.py \
                --repo "$GITHUB_REPOSITORY" --tag "$tag" --asset "$asset"

              echo "$tag" >> processed_tags.txt
            done
          }

          process_package "package.json" "plugins"
          process_package "package.v2.json" "plugins.v2"
          process_package "package.v3.json" "plugins.v3"
