name: Plugin Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-release-gate:
    name: Plugin release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

  plugin-test-gate:
    name: Plugin test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          path: MoviePilot-Plugins

      - name: Checkout MoviePilot V3 backend
        uses: actions/checkout@v7
        with:
          repository: jxxghp/MoviePilot
          ref: v3
          path: MoviePilot

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version-file: MoviePilot/pyproject.toml
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            MoviePilot/pyproject.toml
            MoviePilot/uv.lock

      - name: Install backend test environment
        working-directory: MoviePilot
        run: uv sync --locked

      - name: Run V3 plugin tests
        env:
          MOVIEPILOT_BACKEND_PATH: ${{ github.workspace }}/MoviePilot
        working-directory: MoviePilot-Plugins
        run: ../MoviePilot/.venv/bin/python tests/run.py
